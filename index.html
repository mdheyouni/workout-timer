<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Workout Timer</title>
<style>
  :root {
    --bg: #1c1c1e;          /* app background — covers the whole screen */
    --surface: #2c2c2e;     /* pills, segmented control */
    --surface-2: #3a3a3c;
    --line: #545458;
    --text: #fff;
    --text-dim: #aeaeb2;
    --card: #fff;
    --card-text: #000;
    --accent: #f5b041;
    --ready: #f5b041;
    --work: #2ecc71;
    --rest: #3498db;
    --setrest: #9b59b6;
    --gap: clamp(10px, 1.6vmin, 18px);
    --radius: clamp(12px, 1.6vmin, 18px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  header {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--gap) * .8) calc(var(--gap) * 1.4);
    padding-top: max(calc(var(--gap) * .8), env(safe-area-inset-top));
  }
  header h1 { margin: 0; font-size: clamp(18px, 2.2vmin, 24px); font-weight: 700; }
  .icon-btn {
    background: none; border: 0; color: var(--text); font-size: 22px; cursor: pointer;
    width: 44px; height: 44px; border-radius: 50%;
  }
  .icon-btn:hover { background: var(--surface); }
  .icon-btn.muted { opacity: .45; }

  .layout {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    max-width: 640px;          /* phones & portrait tablets: one centered column */
    margin: 0 auto;
    padding: 0 calc(var(--gap) * 1.2) 0;
    display: flex; flex-direction: column; gap: calc(var(--gap) * 1.6);
  }

  /* ---------- timer side ---------- */
  .stage { display: flex; flex-direction: column; gap: var(--gap); }
  .card {
    background: var(--card); color: var(--card-text);
    border-radius: var(--radius); text-align: center;
    transition: background-color .3s, color .3s;
  }
  .main {
    padding: clamp(12px, 2.5vmin, 28px) 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .main .label { font-size: clamp(26px, 7vw, 44px); font-weight: 700; line-height: 1.1; }
  .main .time {
    font-size: clamp(64px, 19vw, 150px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .main .sub { font-size: clamp(13px, 3.4vw, 18px); font-weight: 600; opacity: .7; margin-top: 6px; min-height: 1.2em; }
  .main.ready   { background: var(--ready);   color: #000; }
  .main.work    { background: var(--work);    color: #000; }
  .main.rest    { background: var(--rest);    color: #fff; }
  .main.setrest { background: var(--setrest); color: #fff; }
  .main.done    { background: var(--accent);  color: #000; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .counter { padding: clamp(8px, 1.8vmin, 18px) 6px; }
  .counter .val { font-size: clamp(26px, 7.5vw, 48px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .counter .name { font-size: clamp(18px, 5vw, 30px); font-weight: 500; }

  .controls { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
  .controls.running { grid-template-columns: 2fr 1fr; }
  .btn {
    background: var(--card); color: #000; border: 0; border-radius: var(--radius);
    font-size: clamp(20px, 5vw, 28px); font-weight: 600; min-height: 56px; padding: 12px; cursor: pointer;
  }
  .btn:hover { filter: brightness(.94); }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: var(--surface-2); color: #fff; }
  #resetBtn { display: none; }
  .controls.running #resetBtn { display: block; }

  /* ---------- settings side ---------- */
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .panel h2, .settings { transition: opacity .3s; }
  .panel h2 {
    margin: 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .panel.locked h2, .panel.locked .settings { opacity: .4; pointer-events: none; }
  .settings { display: flex; flex-direction: column; gap: 10px; }
  .setting { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; transition: opacity .2s; }
  .setting.off { opacity: .35; }
  .pill {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    min-height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 12px; font-size: 15px;
  }
  .pill .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .stepper { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stepper button {
    background: var(--surface); border: 0; color: #fff; width: 48px; height: 44px;
    font-size: 22px; cursor: pointer;
  }
  .stepper button:hover { background: var(--surface-2); }
  .stepper button:disabled { cursor: default; background: var(--surface); }
  .stepper button + button { border-left: 1px solid var(--line); }

  .mode { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .mode-label { font-size: 15px; color: var(--text-dim); margin-left: 2px; }
  .seg {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px;
  }
  .seg button {
    min-height: 38px; border: 0; border-radius: 8px; background: none; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .seg button:hover { background: var(--surface-2); }
  .seg button[aria-checked="true"] { background: #fff; color: #000; }

  /* total sits right under the settings; sticks to the bottom only if the list scrolls */
  .total {
    position: sticky; bottom: 0;
    margin-top: 4px;
    background: var(--bg);
    border-top: 1px solid var(--surface);
    text-align: center; font-size: clamp(18px, 2.4vmin, 24px); font-weight: 700;
    padding: 12px 0 max(12px, env(safe-area-inset-bottom));
  }
  .total span { color: var(--accent); font-variant-numeric: tabular-nums; }

  .pill span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- small phones: tighten spacing so everything fits ---------- */
  @media (max-width: 599px) {
    .layout { gap: var(--gap); }
    .settings { gap: 8px; }
    .panel { gap: 8px; }
  }

  /* ---------- portrait tablets: wider column, settings on two columns ---------- */
  @media (min-width: 600px) and (max-width: 1099px) and (orientation: portrait) {
    .layout { max-width: 820px; padding-left: 32px; padding-right: 32px; }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
    .settings .mode { grid-column: 1 / -1; }
    .pill { font-size: 16px; min-height: 48px; }
    .stepper button { height: 48px; width: 52px; }
  }

  /* ---------- wide screens (landscape tablets, desktops): two columns ---------- */
  @media (min-width: 1100px), (min-width: 640px) and (orientation: landscape) {
    .layout {
      max-width: 1600px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(340px, 34vw, 500px);
      gap: calc(var(--gap) * 2);
      overflow: hidden;
      padding-bottom: calc(var(--gap) * 1.4);
    }
    .stage { min-height: 0; }
    .main { flex: 1 1 auto; min-height: 0; }
    .main .label { font-size: clamp(24px, min(4.5vw, 6vh), 64px); }
    .main .time  { font-size: clamp(60px, min(15vw, 24vh), 260px); }
    .main .sub   { font-size: clamp(13px, min(1.8vw, 2.6vh), 22px); }
    .counter .val  { font-size: clamp(22px, min(4vw, 6vh), 56px); }
    .counter .name { font-size: clamp(15px, min(2.6vw, 4vh), 32px); }
    .btn { font-size: clamp(18px, min(2.4vw, 3.6vh), 30px); min-height: clamp(48px, 9vh, 76px); }
    .panel {
      min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden;
      padding-left: calc(var(--gap) * 2);
      border-left: 1px solid var(--surface);
    }
  }
  /* big screens: scale the settings up so they don't look tiny next to the timer */
  @media (min-width: 1280px) and (min-height: 760px) {
    .panel h2 { font-size: 14px; }
    .settings { gap: 14px; }
    .pill, .seg button, .mode-label { font-size: 17px; }
    .pill { min-height: 52px; padding: 0 16px; }
    .stepper button { height: 52px; width: 56px; font-size: 24px; }
    .seg button { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Workout Timer</h1>
    <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">🔔</button>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Timer">
      <div class="card main" id="mainCard">
        <div class="label" id="phaseLabel" aria-live="polite">Workout time</div>
        <div class="time" id="phaseTime">00:00</div>
        <div class="sub" id="phaseSub"></div>
      </div>
      <div class="row">
        <div class="card counter"><div class="val" id="exCount">0 / 0</div><div class="name">Exercise</div></div>
        <div class="card counter"><div class="val" id="setCount">0 / 0</div><div class="name">Set</div></div>
      </div>
      <div class="controls" id="controls">
        <button class="btn" id="startBtn">Start</button>
        <button class="btn secondary" id="resetBtn">Reset</button>
      </div>
    </section>

    <section class="panel" id="panel" aria-label="Settings">
      <h2>Settings</h2>
      <div class="settings" id="settings"></div>
      <div class="total">Total workout <span id="total">00:00</span></div>
    </section>
  </main>
</div>

<script>
const SETTINGS = [
  { key: 'ready',   label: 'Ready time',             type: 'time',  def: 30, min: 0, max: 600,  step: 5 },
  { key: 'work',    label: 'Exercise time',          type: 'time',  def: 35, min: 5, max: 3600, step: 5 },
  { key: 'exCount', label: 'Exercises',              type: 'count', def: 4,  min: 1, max: 50,   step: 1 },
  { key: 'sets',    label: 'Sets',                   type: 'count', def: 4,  min: 1, max: 50,   step: 1 },
  { key: 'restEx',  label: 'Rest between exercises', type: 'time',  def: 30, min: 0, max: 3600, step: 5 },
  { key: 'restSet', label: 'Rest between sets',      type: 'time',  def: 30, min: 0, max: 3600, step: 5 },
];
const REST_MODES = [
  { id: 'exercise', label: 'Exercises' },
  { id: 'set',      label: 'Sets' },
  { id: 'both',     label: 'Both' },
];

const $ = id => document.getElementById(id);
const fmt = s => {
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};

// ---------- persisted state ----------
let cfg = {};
let soundOn = true;
try {
  const saved = JSON.parse(localStorage.getItem('wt-cfg') || '{}');
  SETTINGS.forEach(s => cfg[s.key] = Number.isFinite(saved[s.key]) ? saved[s.key] : s.def);
  cfg.restMode = REST_MODES.some(m => m.id === saved.restMode) ? saved.restMode : 'both';
  soundOn = localStorage.getItem('wt-sound') !== '0';
} catch { SETTINGS.forEach(s => cfg[s.key] = s.def); cfg.restMode = 'both'; }
const save = () => { try { localStorage.setItem('wt-cfg', JSON.stringify(cfg)); } catch {} };

// ---------- build the plan (list of phases) ----------
const restExOn  = () => cfg.restMode !== 'set';
const restSetOn = () => cfg.restMode !== 'exercise';

function buildPlan() {
  const plan = [];
  if (cfg.ready > 0) plan.push({ kind: 'ready', label: 'Get ready', dur: cfg.ready, ex: 0, set: 1 });
  for (let s = 1; s <= cfg.sets; s++) {
    for (let e = 1; e <= cfg.exCount; e++) {
      plan.push({ kind: 'work', label: 'Exercise', dur: cfg.work, ex: e, set: s });
      // Same rules as the reference app: a rest after every exercise
      // and a set rest after every set, including the last ones.
      if (restExOn() && cfg.restEx > 0)
        plan.push({ kind: 'rest', label: 'Rest', dur: cfg.restEx, ex: e, set: s });
    }
    if (restSetOn() && cfg.restSet > 0)
      plan.push({ kind: 'setrest', label: 'Set rest', dur: cfg.restSet, ex: cfg.exCount, set: s });
  }
  return plan;
}
const totalOf = plan => plan.reduce((a, p) => a + p.dur, 0);

// ---------- settings UI ----------
const settingsEl = $('settings');
SETTINGS.forEach(s => {
  if (s.key === 'restEx') {
    const mode = document.createElement('div');
    mode.className = 'mode';
    mode.innerHTML = `
      <span class="mode-label" id="modeLabel">Rest between</span>
      <div class="seg" role="radiogroup" aria-labelledby="modeLabel">
        ${REST_MODES.map(m => `<button role="radio" data-mode="${m.id}">${m.label}</button>`).join('')}
      </div>`;
    settingsEl.appendChild(mode);
  }
  const row = document.createElement('div');
  row.className = 'setting';
  row.id = 'row-' + s.key;
  row.innerHTML = `
    <div class="pill"><span>${s.label}</span><span class="v" id="v-${s.key}"></span></div>
    <div class="stepper">
      <button data-k="${s.key}" data-d="-1" aria-label="Decrease ${s.label}">−</button>
      <button data-k="${s.key}" data-d="1" aria-label="Increase ${s.label}">+</button>
    </div>`;
  settingsEl.appendChild(row);
});

settingsEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  cfg.restMode = b.dataset.mode;
  save();
  renderIdle();
});

function bump(key, dir) {
  const s = SETTINGS.find(x => x.key === key);
  cfg[key] = Math.min(s.max, Math.max(s.min, cfg[key] + dir * s.step));
  save();
  renderIdle();
}

// press-and-hold to repeat
settingsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  e.preventDefault();
  const k = b.dataset.k, d = +b.dataset.d;
  bump(k, d);
  let delay = 400, t;
  const tick = () => { bump(k, d); delay = Math.max(60, delay * 0.8); t = setTimeout(tick, delay); };
  t = setTimeout(tick, delay);
  const stop = () => { clearTimeout(t); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); };
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
});

// ---------- sound ----------
let audio;
function beep(freq = 880, ms = 150, vol = 0.25) {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + ms / 1000);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch {}
}
function renderSound() {
  $('soundBtn').classList.toggle('muted', !soundOn);
  $('soundBtn').textContent = soundOn ? '🔔' : '🔕';
}
$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem('wt-sound', soundOn ? '1' : '0'); } catch {}
  renderSound();
};

// ---------- wake lock (keep screen on while running) ----------
let wakeLock = null;
async function lockScreen() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
function unlockScreen() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state === 'running') lockScreen();
});

// ---------- timer engine ----------
let state = 'idle';        // idle | running | paused | done
let plan = [], idx = 0;
let phaseEnd = 0;          // performance.now() timestamp when current phase ends
let pausedLeft = 0;        // seconds left in phase when paused
let lastWhole = null, ticker = null;

function renderIdle() {
  SETTINGS.forEach(s => $('v-' + s.key).textContent = s.type === 'time' ? fmt(cfg[s.key]) : cfg[s.key]);
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-checked', b.dataset.mode === cfg.restMode));
  [['restEx', restExOn()], ['restSet', restSetOn()]].forEach(([k, on]) => {
    $('row-' + k).classList.toggle('off', !on);
    $('row-' + k).querySelectorAll('button').forEach(b => b.disabled = !on);
  });
  const total = totalOf(buildPlan());
  $('total').textContent = fmt(total);
  if (state !== 'idle') return;
  $('mainCard').className = 'card main';
  $('phaseLabel').textContent = 'Workout time';
  $('phaseTime').textContent = fmt(total);
  $('phaseSub').textContent = '';
  $('exCount').textContent = `0 / ${cfg.exCount}`;
  $('setCount').textContent = `0 / ${cfg.sets}`;
}

function remainingTotal(phaseLeft) {
  let r = phaseLeft;
  for (let i = idx + 1; i < plan.length; i++) r += plan[i].dur;
  return r;
}

function renderRunning(left) {
  const p = plan[idx];
  $('mainCard').className = 'card main ' + p.kind;
  $('phaseLabel').textContent = p.label;
  $('phaseTime').textContent = fmt(left);
  const next = plan[idx + 1];
  $('phaseSub').textContent = state === 'paused' ? 'Paused' : (next ? `Next: ${next.label} · ${fmt(next.dur)}` : 'Last one!');
  $('exCount').textContent = `${p.ex} / ${cfg.exCount}`;
  $('setCount').textContent = `${p.set} / ${cfg.sets}`;
  $('total').textContent = fmt(remainingTotal(left));
}

function startPhase(i) {
  idx = i;
  if (idx >= plan.length) return finish();
  phaseEnd = performance.now() + plan[idx].dur * 1000;
  lastWhole = null;
  plan[idx].kind === 'work' ? beep(1320, 350) : beep(660, 350);
}

function loop() {
  if (state !== 'running') return;
  const left = (phaseEnd - performance.now()) / 1000;
  if (left <= 0) {
    startPhase(idx + 1);
    if (state !== 'running') return;
  } else {
    const whole = Math.ceil(left);
    if (whole !== lastWhole) {
      if (lastWhole !== null && whole <= 3) beep(880, 120);
      lastWhole = whole;
      renderRunning(left);
    }
  }

}

function finish() {
  state = 'done';
  clearInterval(ticker);
  unlockScreen();
  beep(1320, 200); setTimeout(() => beep(1320, 200), 250); setTimeout(() => beep(1760, 500), 500);
  $('mainCard').className = 'card main done';
  $('phaseLabel').textContent = 'Done! 💪';
  $('phaseTime').textContent = fmt(totalOf(plan));
  $('phaseSub').textContent = 'Great workout';
  $('exCount').textContent = `${cfg.exCount} / ${cfg.exCount}`;
  $('setCount').textContent = `${cfg.sets} / ${cfg.sets}`;
  $('total').textContent = fmt(totalOf(plan));
  setControls();
}

function setControls() {
  const running = state === 'running' || state === 'paused';
  $('controls').classList.toggle('running', running || state === 'done');
  $('panel').classList.toggle('locked', running);
  $('startBtn').textContent =
    state === 'running' ? 'Pause' : state === 'paused' ? 'Resume' : state === 'done' ? 'Start again' : 'Start';
}

$('startBtn').onclick = () => {
  if (state === 'idle' || state === 'done') {
    plan = buildPlan();
    state = 'running';
    startPhase(0);
    lockScreen();
    clearInterval(ticker); ticker = setInterval(loop, 100); loop();
  } else if (state === 'running') {
    state = 'paused';
    pausedLeft = (phaseEnd - performance.now()) / 1000;
    clearInterval(ticker);
    unlockScreen();
    renderRunning(pausedLeft);
  } else if (state === 'paused') {
    state = 'running';
    phaseEnd = performance.now() + pausedLeft * 1000;
    lastWhole = null;
    lockScreen();
    clearInterval(ticker); ticker = setInterval(loop, 100); loop();
  }
  setControls();
};

$('resetBtn').onclick = () => {
  state = 'idle';
  clearInterval(ticker);
  unlockScreen();
  setControls();
  renderIdle();
};

// spacebar = start/pause
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); $('startBtn').click(); }
});

renderSound();
renderIdle();
setControls();

// offline support once installed (needs https hosting; skipped when opened as a local file)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
